[package]
name = "devtree"
version = "0.1.0"
description = "A lightweight, local GitKraken-style git client with a retro Claude-themed UI"
edition = "2024"

[dependencies]
axum = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
