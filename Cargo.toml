[package]
name = "devtree"
version = "0.1.0"
description = "A lightweight, local GitKraken-style git client with a retro Claude-themed UI"
edition = "2024"
license = "MIT"
repository = "https://github.com/ErmanDev/DevTree"

[dependencies]
axum = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
# The desktop window: the system's own web engine (WebView2, WKWebView or WebKitGTK).
tao = { version = "0.37.1", optional = true }
wry = { version = "0.57.0", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# macOS only delivers Cmd+C/V/X/A/Z and Cmd+Q to a window through its menu bar.
muda = { version = "0.21.2", optional = true }

[target.'cfg(windows)'.build-dependencies]
# Gives devtree.exe its icon and version details in Explorer.
winresource = "0.1.31"

[features]
default = ["desktop"]
# Build without it (`--no-default-features`) for a browser-only binary with no GUI libraries.
desktop = ["dep:tao", "dep:wry", "dep:muda"]

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
