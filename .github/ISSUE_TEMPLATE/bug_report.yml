name: Bug report
description: Something doesn't work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! For security problems, please use private reporting instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a repository with …
        2. Click …
        3. See …
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console output
      description: Open the Console at the bottom of the DevTree window and paste the git commands and output around the problem.
      render: text
  - type: input
    id: version
    attributes:
      label: DevTree version
      placeholder: v0.1.1
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux, Other]
    validations:
      required: true
  - type: input
    id: git
    attributes:
      label: git version
      description: Output of `git --version`.
