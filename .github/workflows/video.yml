name: Promo video

# Renders the Remotion promo videos (marketing/) and uploads them as a workflow artifact.
# Run it by hand: Actions → Promo video → Run workflow.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: marketing/package-lock.json
      - run: npm ci
      - name: Render 16:9 and 1:1
        run: npm run render
      - name: Poster image
        run: npm run still
      - uses: actions/upload-artifact@v4
        with:
          name: devtree-promo
          path: marketing/out/
          retention-days: 30
